<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>注册 - RAG 复习助手</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-page">
  <main class="auth-layout">
    <div class="auth-brand-block">
      <div class="brand-mark">R</div>
      <div>
        <h1 style="margin:0;font-size:1.75rem;">RAG 复习助手</h1>
        <p class="small" style="margin:0.35rem 0 0;">创建账号后即可开始上传课件、生成题目和管理错题本</p>
      </div>
    </div>

    <section class="card auth-shell">
      <div class="card-title">注册</div>
      <form class="form-grid">
        <label class="field"><span>用户名</span><input type="text" name="username" class="input" placeholder="设置一个用户名"></label>
        <label class="field"><span>邮箱</span><input type="email" name="email" class="input" placeholder="name@example.com"></label>
        <label class="field"><span>密码</span><input type="password" name="password" class="input" placeholder="此版本可留空"></label>
        <button class="button primary" type="button">注册</button>
      </form>
      <div class="auth-footer">已有账号？<a href="/login">返回登录</a></div>
    </section>
  </main>
  <script src="/static/js/page-register.js"></script>
</body>
</html>
