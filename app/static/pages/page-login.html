<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>登录 - RAG 复习助手</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-page">
  <main class="auth-layout">
    <div class="auth-brand-block">
      <div class="brand-mark">R</div>
      <div>
        <h1 style="margin:0;font-size:1.75rem;">RAG 复习助手</h1>
        <p class="small" style="margin:0.35rem 0 0;">登录后继续你的错题整理、知识卡片与复习历史</p>
      </div>
    </div>

    <section class="card auth-shell">
      <div class="card-title">登录</div>
      <form class="form-grid">
        <label class="field"><span>用户名</span><input type="text" name="username" class="input" placeholder="请输入用户名"></label>
        <label class="field"><span>密码</span><input type="password" name="password" class="input" placeholder="此版本可留空"></label>
        <button class="button primary" type="button">登录</button>
      </form>
      <div class="auth-footer">还没有账号？<a href="/register">前往注册</a></div>
    </section>
  </main>
  <script src="/static/js/page-login.js"></script>
</body>
</html>
