{% extends "index.html" %}

{% block body_class %}auth-page{% endblock %}

{% block content %}
<section class="auth-page-shell">
  <main class="auth-layout">
    <div class="auth-brand-block">
      <div class="brand-mark">R</div>
      <div>
        <h1 style="margin:0;font-size:1.75rem;">RAG 复习助手</h1>
        <p class="small" style="margin:0.35rem 0 0;">创建账号后即可开始上传课件、生成知识卡片、练习答题和管理错题本</p>
      </div>
    </div>

    <section class="card auth-shell">
      <div class="card-title">注册</div>
      <form id="register-form" class="form-grid">
        <label class="field"><span>用户名</span><input type="text" name="username" class="input" placeholder="设置一个用户名" autocomplete="username" minlength="3" maxlength="20" pattern="[A-Za-z0-9_]{3,20}" required></label>
        <label class="field"><span>邮箱</span><input type="email" name="email" class="input" placeholder="name@example.com" autocomplete="email"></label>
        <label class="field"><span>密码</span><input type="password" name="password" class="input" placeholder="请设置密码（8-32位，含字母和数字）" autocomplete="new-password" minlength="8" maxlength="32" required></label>
        <button id="register-submit" class="button primary" type="submit">注册</button>
      </form>
      <div class="small" style="margin-top:0.5rem;">用户名仅支持字母/数字/下划线；密码需 8-32 位且至少包含字母和数字。</div>
      <div id="auth-message" class="notice hidden" role="status" aria-live="polite"></div>
      <div class="auth-footer">已有账号？<a href="/login">返回登录</a></div>
    </section>
  </main>
</section>
<script src="/static/js/page-register.js"></script>
{% endblock %}
