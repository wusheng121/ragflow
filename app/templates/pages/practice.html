{% extends "index.html" %}

{% block content %}
<div class="app-layout">
  {% include "partials/sidebar.html" %}
  <section class="page-content">
    <div class="page-header">
      <h1>练习抽查</h1>
      <p class="muted">围绕课件知识点生成引导性问题，提交答案后系统会给出评分、纠正与错题记录。</p>
    </div>

    <section class="card">
      <div class="form-grid">
        <label class="field"><span>学习范围</span><select id="study-scope" class="input"><option value="material">按单个资料</option><option value="subject">按整个学科</option></select></label>
        <label class="field"><span>学科选择</span><select id="study-subject-select" class="input"></select></label>
        <label class="field"><span>资料选择</span><select id="material-select" class="input"></select></label>
        <label class="field"><span>概念</span><input id="practice-concept" class="input" placeholder="例如：边际效应递减"></label>
        <label class="field"><span>学生水平</span>
          <select id="practice-level" class="input">
            <option value="beginner">初级</option>
            <option value="intermediate">中级</option>
            <option value="advanced">高级</option>
          </select>
        </label>
        <button type="button" id="generate-question" class="button primary">生成引导问题</button>
        <button type="button" id="refresh-materials" class="button ghost">刷新资料</button>
      </div>
    </section>

    <section class="card">
      <div class="card-title">系统生成的问题</div>
      <div id="question-result" class="stack"></div>
    </section>

    <section class="card">
      <div class="card-title">提交答案并评分</div>
      <form id="answer-form" class="form-grid">
        <label class="field"><span>学生答案</span><textarea id="answer-text" class="textarea" rows="4" placeholder="请在这里填写你的答案"></textarea></label>
        <button type="submit" class="button primary">提交答案</button>
      </form>
      <div id="answer-result" class="stack"></div>
    </section>

    <section class="card">
      <div class="split-row">
        <div class="card-title" style="margin:0;">一致性评估</div>
        <button type="button" id="check-consistency" class="button ghost">评估答案与证据一致性</button>
      </div>
      <div id="consistency-result" class="stack"></div>
    </section>
  </section>
</div>
<script src="/static/js/page-dashboard.js"></script>
{% endblock %}
