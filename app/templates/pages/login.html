{% extends "index.html" %}

{% block body_class %}auth-page{% endblock %}

{% block content %}
<section class="auth-page-shell">
  <main class="auth-layout">
    <div class="auth-brand-block">
      <div class="brand-mark">R</div>
      <div>
        <h1 style="margin:0;font-size:1.75rem;">RAG 复习助手</h1>
        <p class="small" style="margin:0.35rem 0 0;">登录后继续你的错题整理、知识卡片与复习历史</p>
      </div>
    </div>

    <section class="card auth-shell">
      <div class="card-title">登录</div>
      <form id="login-form" class="form-grid">
        <label class="field"><span>用户名</span><input type="text" name="username" class="input" placeholder="请输入用户名" autocomplete="username" required></label>
        <label class="field"><span>密码</span><input type="password" name="password" class="input" placeholder="请输入密码" autocomplete="current-password" minlength="8" required></label>
        <button id="login-submit" class="button primary" type="submit">登录</button>
      </form>
      <div id="auth-message" class="notice hidden" role="status" aria-live="polite"></div>
      <div class="auth-footer">还没有账号？<a href="/register">前往注册</a></div>
    </section>
  </main>
</section>
<script src="/static/js/page-login.js"></script>
{% endblock %}
